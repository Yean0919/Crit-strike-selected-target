[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crit-strike-selected-target"
version = "0.1.0"
description = "Local-first Windows and macOS desktop avatar detection and playful effects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "PySide6==6.8.3",
  "opencv-python-headless==4.11.0.86",
  "mss==10.0.0",
  "numpy==2.2.6",
  "pyobjc-framework-ScreenCaptureKit==11.1; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==11.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.11", "build==1.2.2.post1", "pyinstaller==6.13.0"]

[project.gui-scripts]
crit-strike = "crit_strike.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crit_strike = ["mods/*.json", "licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
