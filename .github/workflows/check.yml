name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/privacy_scan.py
      - run: git diff --check
